# =============================================================================
# Sistema de Alerta de Capital Imobilizado
# Banco de dados MySQL em container Docker (ambiente de DESENVOLVIMENTO LOCAL)
#
# Uso:
#   docker compose up -d      -> sobe o banco em segundo plano
#   docker compose down       -> para o container (os dados são mantidos)
#   docker compose down -v    -> para e APAGA os dados (o setup roda de novo
#                                na próxima subida)
# =============================================================================

services:
  mysql:
    # Imagem oficial do MySQL, versão 8.4 (LTS)
    image: mysql:8.4
    container_name: alerta_capital_mysql
    restart: unless-stopped

    environment:
      # Senha do usuário root. Apenas para desenvolvimento local!
      MYSQL_ROOT_PASSWORD: dev123
      # Fuso horário do container, para que CURDATE() use a data do Brasil
      TZ: America/Sao_Paulo

    # Garante que o servidor trabalhe com utf8mb4 (acentuação em português)
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    ports:
      # Porta do Windows (esquerda) -> porta do container (direita)
      - "3306:3306"

    volumes:
      # Scripts nesta pasta são executados automaticamente pelo MySQL
      # apenas na PRIMEIRA inicialização (quando o volume de dados está vazio)
      - ./setup_banco.sql:/docker-entrypoint-initdb.d/setup_banco.sql:ro
      # Volume nomeado para persistir os dados entre reinicializações
      - mysql_dados:/var/lib/mysql

    # Verifica se o MySQL já está pronto para receber conexões
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pdev123"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_dados:
